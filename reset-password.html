<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YAS SOFTWARE — إعادة تعيين كلمة المرور</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #05070A; color: #F1F5F9; font-family: Tahoma, Arial, sans-serif; text-align: center;
  }
  .card { max-width: 360px; padding: 32px 24px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #94A3B8; font-size: 14px; line-height: 1.7; }
  a.btn {
    display: inline-block; margin-top: 18px; background: #2563EB; color: #fff; text-decoration: none;
    padding: 12px 28px; border-radius: 10px; font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>جارٍ فتح YAS SOFTWARE...</h1>
    <p id="msg">لو التطبيق متثبّتش تلقائيًا، دوس الزرار تحت.</p>
    <a class="btn" id="openBtn" href="#">فتح التطبيق</a>
  </div>
  <script>
    // Supabase puts the recovery token after '#' (a URL fragment), which the browser never
    // sends to the server. Forward it to the app as a query string: unlike a bare custom
    // scheme, an Android "intent:" URL is allowed by Chrome/Gmail and targets the app directly.
    var PKG = "com.yas.flashedl";
    var params = window.location.hash.replace(/^#/, "") || window.location.search.replace(/^\?/, "");
    var isAndroid = /android/i.test(navigator.userAgent);
    var plain  = "yassoftware://reset-password?" + params;
    var intentUrl = "intent://reset-password?" + params +
                    "#Intent;scheme=yassoftware;package=" + PKG + ";end";
    var target = isAndroid ? intentUrl : plain;
    var btn = document.getElementById("openBtn");
    btn.href = target;
    if (/error=/.test(params)) {
      document.getElementById("msg").textContent = "الرابط منتهي أو مستخدم من قبل. اطلب رابطًا جديدًا من التطبيق.";
    }
    // Try automatically (works in some browsers); the button is the reliable path (user tap).
    setTimeout(function () { window.location.href = target; }, 300);
  </script>
</body>
</html>
