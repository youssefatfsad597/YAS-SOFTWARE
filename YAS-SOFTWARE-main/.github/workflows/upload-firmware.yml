name: Upload Firmware File to Server

# Runs tools/upload_firmware.py on GitHub's runner -- so you never need a computer,
# only a phone browser (or the GitHub mobile app) to fill in the form below from the
# Actions tab -> "Upload Firmware File to Server" -> "Run workflow".
#
# One-time setup (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SUPABASE_URL                 same value as the other workflows' SUPABASE_URL secret
#   SUPABASE_SERVICE_ROLE_KEY    Project Settings -> API -> service_role (SECRET -- this
#                                 key bypasses every RLS policy in the project; never put
#                                 it in app/build.gradle.kts or any client-side code)
#
# The plaintext firmware file itself is NEVER committed to git. Give either:
#   - firmware_url: a direct HTTPS download link (works from any host that serves the
#     raw bytes -- e.g. a Google Drive "direct download" link, a temporary file host,
#     a private release asset URL with a token, etc.), OR
#   - repo_file_path: a path to a file already in THIS repository (if you uploaded it
#     via the GitHub web "Add file" button from your phone -- note the web UI caps
#     single-file uploads around 25 MB, so this only works for smaller files; use
#     firmware_url for anything larger).
# Give exactly one of the two.

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Direct HTTPS link to the PLAINTEXT firmware file (leave blank if using repo_file_path)"
        required: false
      repo_file_path:
        description: "OR: path to a file already committed in this repo (leave blank if using firmware_url)"
        required: false
      slug:
        description: "Catalog slug the app will request, e.g. x216b/sec_efs.bin"
        required: true
      display_name:
        description: "Human-readable name shown in the app"
        required: true
      device_model:
        description: "e.g. X216B (optional)"
        required: false
      cert_sha256:
        description: "Lowercase hex SHA-256 of your RELEASE signing cert (leave blank to use the debug cert, for testing only)"
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Resolve the firmware file
        run: |
          set -e
          if [ -n "${{ inputs.firmware_url }}" ] && [ -n "${{ inputs.repo_file_path }}" ]; then
            echo "::error::Give either firmware_url OR repo_file_path, not both."
            exit 1
          fi
          if [ -n "${{ inputs.firmware_url }}" ]; then
            echo "Downloading from URL..."
            curl -fL --retry 3 -o /tmp/firmware_plaintext.bin "${{ inputs.firmware_url }}"
          elif [ -n "${{ inputs.repo_file_path }}" ]; then
            [ -f "${{ inputs.repo_file_path }}" ] || { echo "::error::${{ inputs.repo_file_path }} not found in the repo."; exit 1; }
            cp "${{ inputs.repo_file_path }}" /tmp/firmware_plaintext.bin
          else
            echo "::error::Give firmware_url or repo_file_path."
            exit 1
          fi
          ls -la /tmp/firmware_plaintext.bin

      - name: Upload + register (tools/upload_firmware.py)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          ARGS=(--file /tmp/firmware_plaintext.bin --slug "${{ inputs.slug }}" --display-name "${{ inputs.display_name }}")
          if [ -n "${{ inputs.device_model }}" ]; then ARGS+=(--device-model "${{ inputs.device_model }}"); fi
          if [ -n "${{ inputs.cert_sha256 }}" ]; then ARGS+=(--cert-sha256 "${{ inputs.cert_sha256 }}"); fi
          python3 tools/upload_firmware.py "${ARGS[@]}"

      - name: Clean up local copy
        if: always()
        run: rm -f /tmp/firmware_plaintext.bin
