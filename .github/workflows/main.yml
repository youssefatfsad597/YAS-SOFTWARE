              onPickCscTar: () -> Unit,
              onPickUserdataTar: () -> Unit,
              onToggleSkipSystemFilesInUserdataTar: (Boolean) -> Unit,
              onRunOdinFlash: () -> Unit,
              onFlashUserdataOnly: () -> Unit,
              onToggleOdinAutoReboot: (Boolean) -> Unit,
              onExitDownloadMode: () -> Unit,
              onReadMtpInfo: () -> Unit,
              onReadAdbInfo: () -> Unit,
              onAdbReboot: (String, String) -> Unit,
              onAdbShell: (String) -> Unit
              ) {
              var selectedTab by remember { mutableIntStateOf(0) }
              val tabs = listOf("1. X216B SERVICE", "2. READ GPT", "3. XML Flasher", "4. Samsung Odin", "5. MTP / ADB")
              var confirmEraseTarget by remember { mutableStateOf<PartitionEntry?>(null) }
              var confirmBatchErase by remember { mutableStateOf(false) }

              if (confirmEraseTarget != null) {
                  val target = confirmEraseTarget!!
                  AlertDialog(
                      onDismissRequest = { confirmEraseTarget = null },
                      title = { Text("Confirm Erase Partition", fontWeight = FontWeight.Bold) },
                      text = { Text("Are you sure you want to erase '${target.name}' on LUN ${target.lun} (${formatSize(target.sizeInBytes)})?") },
                      confirmButton = {
                          Button(
                              onClick = {
                                  onErasePartition(target)
                                  confirmEraseTarget = null
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = YasRed)
                          ) { Text("Erase Now") }
                      },
                      dismissButton = {
                          OutlinedButton(onClick = { confirmEraseTarget = null }) { Text("Cancel") }
                      }
                  )
              }

              if (confirmBatchErase) {
                  AlertDialog(
                      onDismissRequest = { confirmBatchErase = false },
                      title = { Text("Erase Selected Partitions", fontWeight = FontWeight.Bold) },
                      text = { Text("Are you sure you want to erase ${state.selectedPartKeys.size} selected partitions?") },
                      confirmButton = {
                          Button(
                              onClick = {
                                  onEraseSelectedParts()
                                  confirmBatchErase = false
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = YasRed)
                          ) { Text("Erase All Selected") }
                      },
                      dismissButton = {
                          OutlinedButton(onClick = { confirmBatchErase = false }) { Text("Cancel") }
                      }
                  )
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(YasDarkBg)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(YasHeaderGradient)
                          .border(width = 1.dp, color = YasBorder)
                          .padding(horizontal = 14.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text("YAS", color = YasCyan, fontWeight = FontWeight.ExtraBold, fontSize = 20.sp)
                              Text("FLASH EDL", color = YasOrange, fontWeight = FontWeight.ExtraBold, fontSize = 20.sp)
                          }
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              Box(
                                  modifier = Modifier
                                      .size(7.dp)
                                      .background(if (state.usbAny) YasGreen else YasMuted, RoundedCornerShape(50))
                              )
                              Text(
                                  text = state.usbSummary,
                                  fontSize = 11.sp,
                                  maxLines = 3,
                                  overflow = TextOverflow.Ellipsis,
                                  color = if (state.usbAny) YasGreen else YasMuted
                              )
                          }
                      }

                      Button(
                          onClick = onConnectUsb,
                          enabled = !state.isBusy,
                          shape = YasAccentShape,
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (state.usbConnected) YasCardBgAlt else YasCyan,
                              contentColor = if (state.usbConnected) Color.White else Color(0xFF07131C)
                          ),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp)
                      ) {
                          Text("Rescan USB", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(YasDarkBg)
                          .border(width = 1.dp, color = YasBorder)
                          .horizontalScroll(rememberScrollState())
                          .padding(horizontal = 10.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Button(
                          onClick = onRunX216BWipeAndWrite,
                          enabled = !state.isBusy,
                          shape = YasAccentShape,
                          colors = ButtonDefaults.buttonColors(containerColor = YasGreen, contentColor = Color(0xFF062A1C)),
                          contentPadding = PaddingValues(horizontal = 14.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("⚡ FORMAT + FRP + MDM", fontSize = 11.sp, fontWeight = FontWeight.ExtraBold)
                      }

                      Button(
                          onClick = onReadGpt,
                          enabled = state.firehoseReady && !state.isBusy,
                          shape = YasAccentShape,
                          colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color(0xFF07131C)),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("Read Full GPT", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { onResetDevice("reset") },
                          enabled = !state.isBusy,
                          shape = YasAccentShape,
                          colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color(0xFF2B1402)),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("Reset / Reboot", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }

                      OutlinedButton(
                          onClick = { onResetDevice("off") },
                          enabled = !state.isBusy,
                          shape = YasAccentShape,
                          border = androidx.compose.foundation.BorderStroke(1.dp, YasBorder),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("Power Off", fontSize = 11.sp, color = Color.White)
                      }

                      OutlinedButton(
                          onClick = onResetFrp,
                          enabled = state.firehoseReady && !state.isBusy,
                          shape = YasAccentShape,
                          border = androidx.compose.foundation.BorderStroke(1.dp, YasBorder),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("Erase FRP", fontSize = 11.sp, color = YasCyan)
                      }

                      OutlinedButton(
                          onClick = onFactoryReset,
                          enabled = state.firehoseReady && !state.isBusy,
                          shape = YasAccentShape,
                          border = androidx.compose.foundation.BorderStroke(1.dp, YasBorder),
                          contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp),
                          modifier = Modifier.height(34.dp)
                      ) {
                          Text("Factory Reset", fontSize = 11.sp, color = YasRed)
                      }
                  }

                  TabRow(
                      selectedTabIndex = selectedTab,
                      containerColor = YasCardBg,
                      contentColor = YasCyan,
                      divider = { HorizontalDivider(color = YasBorder, thickness = 1.dp) },
                      indicator = { positions ->
                          TabRowDefaults.SecondaryIndicator(
                              Modifier.tabIndicatorOffset(positions[selectedTab]),
                              height = 2.5.dp,
                              color = YasCyan
                          )
                      }
                  ) {
                      tabs.forEachIndexed { index, title ->
                          Tab(
                              selected = selectedTab == index,
                              onClick = { selectedTab = index },
                              text = {
                                  Text(
                                      title,
                                      fontSize = 12.sp,
                                      fontWeight = if (selectedTab == index) FontWeight.Bold else FontWeight.Normal,
                                      color = if (selectedTab == index) YasCyan else YasMuted
                                  )
                              }
                          )
                      }
                  }

                  Box(
                      modifier = Modifier
                          .weight(0.62f)
                          .fillMaxWidth()
                          .padding(8.dp)
                  ) {
                      when (selectedTab) {
                          0 -> LoaderSetupTab(
                              state = state,
                              onRunX216BWipeAndWrite = onRunX216BWipeAndWrite
                          )
                          1 -> ReadGptTab(
                              state = state,
                              onProbeChipInfo = onProbeChipInfo,
                              onPickLoader = onPickLoader,
                              onStorageSelected = onStorageSelected,
                              onRunSaharaAndFirehose = onRunSaharaAndFirehose,
                              onReadGpt = onReadGpt,
                              onLunFilterSelected = onLunFilterSelected,
                              onTogglePartSelection = onTogglePartSelection,
                              onSelectAllParts = onSelectAllParts,
                              onClearPartSelection = onClearPartSelection,
                              onRequestBatchErase = { confirmBatchErase = true },
                              onBackupPartition = onBackupPartition,
                              onFlashPartition = onFlashPartition,
                              onRequestErasePartition = { confirmEraseTarget = it }
                          )

                          2 -> XmlFirmwareTab(
                              state = state,
                              onPickRawProgram = onPickRawProgram,
                              onPickPatchXml = onPickPatchXml,
                              onPickFirmwareDir = onPickFirmwareDir,
                              onFlashFirmwareXml = onFlashFirmwareXml
                          )
                          3 -> SamsungOdinTab(
                              state = state,
                              onConnectOdinDevice = onConnectOdinDevice,
                              onPickBlTar = onPickBlTar,
                              onPickApTar = onPickApTar,
                              onPickCpTar = onPickCpTar,
                              onPickCscTar = onPickCscTar,
                              onPickUserdataTar = onPickUserdataTar,
                              onToggleSkipSystemFilesInUserdataTar = onToggleSkipSystemFilesInUserdataTar,
                              onRunOdinFlash = onRunOdinFlash,
                              onFlashUserdataOnly = onFlashUserdataOnly,
                              onToggleOdinAutoReboot = onToggleOdinAutoReboot,
                              onExitDownloadMode = onExitDownloadMode
                          )
                          4 -> AdbMtpTab(
                              state = state,
                              onReadMtpInfo = onReadMtpInfo,
                              onReadAdbInfo = onReadAdbInfo,
                              onAdbReboot = onAdbReboot,
                              onAdbShell = onAdbShell
                          )
                      }
                  }

                  TelemetryAndConsolePanel(
                      state = state,
                      onClearLogs = onClearLogs,
                      modifier = Modifier
                          .weight(0.38f)
                          .fillMaxWidth()
                  )
              }
          }

          @Composable
          private fun LoaderSetupTab(
              state: EdlUiState,
              onRunX216BWipeAndWrite: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, YasGreen, RoundedCornerShape(8.dp))
                  ) {
                      Column(modifier = Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(
                              "SM-X216B Service",
                              color = YasGreen,
                              fontWeight = FontWeight.ExtraBold,
                              fontSize = 13.sp
                          )
                          Text(
                              "Uploads the loader and reads the full GPT automatically, then formats the device and rewrites the FRP + MDM partitions.",
                              fontSize = 11.sp,
                              color = Color.LightGray
                          )
                          Button(
                              onClick = onRunX216BWipeAndWrite,
                              enabled = !state.isBusy,
                              colors = ButtonDefaults.buttonColors(containerColor = YasGreen, contentColor = Color.Black),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(46.dp)
                          ) {
                              Text("⚡ FORMAT + FRP + MDM", fontWeight = FontWeight.ExtraBold, fontSize = 14.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ReadGptTab(
              state: EdlUiState,
              onProbeChipInfo: () -> Unit,
              onPickLoader: () -> Unit,
              onStorageSelected: (StorageType) -> Unit,
              onRunSaharaAndFirehose: () -> Unit,
              onReadGpt: () -> Unit,
              onLunFilterSelected: (Int) -> Unit,
              onTogglePartSelection: (String) -> Unit,
              onSelectAllParts: (List<String>) -> Unit,
              onClearPartSelection: () -> Unit,
              onRequestBatchErase: () -> Unit,
              onBackupPartition: (PartitionEntry) -> Unit,
              onFlashPartition: (PartitionEntry) -> Unit,
              onRequestErasePartition: (PartitionEntry) -> Unit
          ) {
              Column(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(8.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          Text(
                              text = state.loaderName,
                              fontSize = 11.sp,
                              color = YasCyan,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .horizontalScroll(rememberScrollState()),
                              horizontalArrangement = Arrangement.spacedBy(6.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              OutlinedButton(
                                  onClick = onPickLoader,
                                  enabled = !state.isBusy,
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                                  modifier = Modifier.height(32.dp)
                              ) {
                                  Text("Select Loader", fontSize = 11.sp, color = Color.White)
                              }

                              StorageType.entries.forEach { type ->
                                  FilterChip(
                                      selected = state.selectedStorage == type,
                                      onClick = { onStorageSelected(type) },
                                      label = { Text("${type.name} (${type.sectorSize}B)", fontSize = 11.sp) }
                                  )
                              }

                              OutlinedButton(
                                  onClick = onProbeChipInfo,
                                  enabled = state.usbConnected && !state.firehoseReady && !state.isBusy,
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                                  modifier = Modifier.height(32.dp)
                              ) {
                                  Text("Read HWID / PK_HASH", fontSize = 11.sp, color = YasCyan)
                              }

                              Button(
                                  onClick = onRunSaharaAndFirehose,
                                  enabled = state.usbConnected && !state.isBusy,
                                  colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color.Black),
                                  contentPadding = PaddingValues(horizontal = 12.dp, vertical = 2.dp),
                                  modifier = Modifier.height(32.dp)
                              ) {
                                  Text("Upload Loader & Read GPT", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }

                          val info = state.deviceInfo
                          if (info != null) {
                              Text(
                                  "${info.msmIdHex} (${info.socName}) | ${info.oemName} | Serial ${info.serialHex}",
                                  fontSize = 10.sp,
                                  color = Color.White,
                                  fontFamily = FontFamily.Monospace,
                                  maxLines = 2
                              )
                              Text(
                                  "PK_HASH: ${info.pkHashHex}",
                                  fontSize = 10.sp,
                                  color = YasOrange,
                                  fontFamily = FontFamily.Monospace,
                                  maxLines = 2
                              )
                          }
                      }
                  }

                  Box(modifier = Modifier
                      .weight(1f)
                      .fillMaxWidth()) {
                      PartitionManagerTab(
                          state = state,
                          onReadGpt = onReadGpt,
                          onLunFilterSelected = onLunFilterSelected,
                          onTogglePartSelection = onTogglePartSelection,
                          onSelectAllParts = onSelectAllParts,
                          onClearPartSelection = onClearPartSelection,
                          onRequestBatchErase = onRequestBatchErase,
                          onBackupPartition = onBackupPartition,
                          onFlashPartition = onFlashPartition,
                          onRequestErasePartition = onRequestErasePartition
                      )
                  }
              }
          }

          @Composable

          private fun PartitionManagerTab(
              state: EdlUiState,
              onReadGpt: () -> Unit,
              onLunFilterSelected: (Int) -> Unit,
              onTogglePartSelection: (String) -> Unit,
              onSelectAllParts: (List<String>) -> Unit,
              onClearPartSelection: () -> Unit,
              onRequestBatchErase: () -> Unit,
              onBackupPartition: (PartitionEntry) -> Unit,
              onFlashPartition: (PartitionEntry) -> Unit,
              onRequestErasePartition: (PartitionEntry) -> Unit
          ) {
              var searchQuery by remember { mutableStateOf("") }

              val availableLuns = remember(state.partitions) {
                  state.partitions.map { it.lun }.distinct().sorted()
              }

              val filtered = remember(state.partitions, state.selectedLunFilter, searchQuery) {
                  state.partitions.filter { part ->
                      val matchesLun = state.selectedLunFilter == -1 || part.lun == state.selectedLunFilter
                      val matchesQuery = searchQuery.isBlank() || part.name.contains(searchQuery, ignoreCase = true)
                      matchesLun && matchesQuery
                  }
              }

              Column(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text("Search partition (frp, sec_efs, persistent, userdata...)", fontSize = 12.sp) },
                          singleLine = true,
                          modifier = Modifier.weight(1f)
                      )

                      Button(
                          onClick = onReadGpt,
                          enabled = state.firehoseReady && !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black)
                      ) {
                          Text("Read GPT (${state.partitions.size})", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .horizontalScroll(rememberScrollState()),
                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      FilterChip(
                          selected = state.selectedLunFilter == -1,
                          onClick = { onLunFilterSelected(-1) },
                          label = { Text("All (${state.partitions.size})", fontSize = 11.sp) }
                      )
                      availableLuns.forEach { lun ->
                          val count = state.partitions.count { it.lun == lun }
                          FilterChip(
                              selected = state.selectedLunFilter == lun,
                              onClick = { onLunFilterSelected(lun) },
                              label = { Text("LUN $lun ($count)", fontSize = 11.sp) }
                          )
                      }

                      Spacer(modifier = Modifier.width(6.dp))

                      OutlinedButton(
                          onClick = { onSelectAllParts(filtered.map { it.idKey }) },
                          enabled = filtered.isNotEmpty() && !state.isBusy,
                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                          modifier = Modifier.height(30.dp)
                      ) {
                          Text("Select All", fontSize = 11.sp, color = YasCyan)
                      }

                      if (state.selectedPartKeys.isNotEmpty()) {
                          OutlinedButton(
                              onClick = onClearPartSelection,
                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                              modifier = Modifier.height(30.dp)
                          ) {
                              Text("Clear (${state.selectedPartKeys.size})", fontSize = 11.sp, color = Color.LightGray)
                          }

                          Button(
                              onClick = onRequestBatchErase,
                              enabled = !state.isBusy,
                              colors = ButtonDefaults.buttonColors(containerColor = YasRed),
                              contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                              modifier = Modifier.height(30.dp)
                          ) {
                              Text("Erase Selected (${state.selectedPartKeys.size})", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  if (filtered.isEmpty()) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(YasCardBg, RoundedCornerShape(8.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = if (state.partitions.isEmpty())
                                  "No GPT partitions loaded yet.\nConnect device and tap 'Read Full GPT' or run the X216B Wipe & Write button."
                              else
                                  "No partitions match your search filter.",
                              color = Color.Gray,
                              fontSize = 12.sp
                          )
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.spacedBy(4.dp)
                      ) {
                          items(filtered, key = { it.idKey }) { part ->
                              val isChecked = part.idKey in state.selectedPartKeys
                              Surface(
                                  color = if (isChecked) Color(0xFF1B2E46) else YasCardBg,
                                  shape = RoundedCornerShape(6.dp),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { onTogglePartSelection(part.idKey) }
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(horizontal = 6.dp, vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Checkbox(
                                              checked = isChecked,
                                              onCheckedChange = { onTogglePartSelection(part.idKey) },
                                              modifier = Modifier.size(32.dp)
                                          )
                                          Column(modifier = Modifier.padding(start = 4.dp)) {
                                              Row(
                                                  verticalAlignment = Alignment.CenterVertically,
                                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                                              ) {
                                                  Text(text = part.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                                  Text(text = "LUN ${part.lun}", color = YasCyan, fontSize = 10.sp, fontWeight = FontWeight.SemiBold)
                                                  Text(text = formatSize(part.sizeInBytes), color = YasOrange, fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                                              }
                                              Text(
                                                  text = "LBA: ${part.firstLba} .. ${part.lastLba} (${part.numSectors} sec)",
                                                  color = Color.Gray,
                                                  fontSize = 10.sp,
                                                  fontFamily = FontFamily.Monospace
                                              )
                                          }
                                      }

                                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                          Button(
                                              onClick = { onBackupPartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1F4068)),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Read", fontSize = 11.sp, color = YasCyan)
                                          }

                                          Button(
                                              onClick = { onFlashPartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Write", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                          }

                                          Button(
                                              onClick = { onRequestErasePartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF4A1C1C)),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Erase", fontSize = 11.sp, color = YasRed, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun XmlFirmwareTab(
              state: EdlUiState,
              onPickRawProgram: () -> Unit,
              onPickPatchXml: () -> Unit,
              onPickFirmwareDir: () -> Unit,
              onFlashFirmwareXml: () -> Unit
          ) {
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  OutlinedButton(onClick = onPickRawProgram, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth()) {
                      Text(state.rawProgramName, color = YasCyan)
                  }
                  OutlinedButton(onClick = onPickPatchXml, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth()) {
                      Text(state.patchXmlName, color = Color.LightGray)
                  }
                  OutlinedButton(onClick = onPickFirmwareDir, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth()) {
                      Text(state.firmwareDirName, color = YasOrange)
                  }
                  Button(
                      onClick = onFlashFirmwareXml,
                      enabled = state.firehoseReady && !state.isBusy && state.rawProgramUri != null && state.firmwareDirUri != null,
