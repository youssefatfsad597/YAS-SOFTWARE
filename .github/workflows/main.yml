                  ) {
                      Text(
                          text = "Task: ${state.currentTask}",
                          fontSize = 12.sp,
                          color = YasCyan,
                          fontWeight = FontWeight.SemiBold
                      )
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(
                              text = String.format("%.2f MB/s | %d%%", state.transferSpeedMbps, (state.progress * 100).toInt()),
                              fontSize = 12.sp,
                              color = YasOrange,
                              fontFamily = FontFamily.Monospace
                          )
                          Text(
                              text = "Clear",
                              fontSize = 11.sp,
                              color = Color.Gray,
                              modifier = Modifier.clickable { onClearLogs() }
                          )
                      }
                  }

                  LinearProgressIndicator(
                      progress = { state.progress },
                      color = YasCyan,
                      trackColor = YasBorder,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(6.dp)
                  )

                  LazyColumn(
                      state = listState,
                      modifier = Modifier
                          .fillMaxSize()
                          .background(YasCardBg, RoundedCornerShape(10.dp))
                          .border(1.dp, YasBorder, RoundedCornerShape(10.dp))
                          .padding(6.dp)
                  ) {
                      items(state.logs) { line ->
                          val isOperationLine = line.contains("Operation completed successfully") ||
                              line.contains("Successfully") || line.contains("FINISHED") ||
                              line.contains("Writing") || line.contains("Erasing") || line.contains("Reading") ||
                              line.contains("Flashing") || line.contains("Connected") || line.contains("connected") ||
                              line.contains("Ready")
                          val color = when {
                              line.contains("WARN") -> YasOrange
                              line.contains("ERROR") -> YasRed
                              isOperationLine -> YasGreen
                              line.contains("STEP") || line.contains("LUN") || line.contains("GPT") -> YasCyan
                              else -> Color(0xFFD0E1F9)
                          }
                          Text(
                              text = line,
                              color = color,
                              fontFamily = FontFamily.Monospace,
                              fontSize = 11.sp,
                              fontWeight = if (isOperationLine) FontWeight.Bold else FontWeight.Normal,
                              lineHeight = 14.sp
                          )
                      }
                  }
              }
          }

          private fun formatSize(bytes: Long): String {
              val kb = bytes / 1024.0
              val mb = kb / 1024.0
              val gb = mb / 1024.0
              return when {
                  gb >= 1.0 -> String.format("%.2f GB", gb)
                  mb >= 1.0 -> String.format("%.2f MB", mb)
                  else -> String.format("%.0f KB", kb)
              }
          }
