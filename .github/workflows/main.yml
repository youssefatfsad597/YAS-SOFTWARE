                          onLunFilterSelected = onLunFilterSelected,
                          onTogglePartSelection = onTogglePartSelection,
                          onSelectAllParts = onSelectAllParts,
                          onClearPartSelection = onClearPartSelection,
                          onRequestBatchErase = onRequestBatchErase,
                          onBackupPartition = onBackupPartition,
                          onFlashPartition = onFlashPartition,
                          onRequestErasePartition = onRequestErasePartition
                      )
                  }
              }
          }

          @Composable

          private fun PartitionManagerTab(
              state: EdlUiState,
              onReadGpt: () -> Unit,
              onLunFilterSelected: (Int) -> Unit,
              onTogglePartSelection: (String) -> Unit,
              onSelectAllParts: (List<String>) -> Unit,
              onClearPartSelection: () -> Unit,
              onRequestBatchErase: () -> Unit,
              onBackupPartition: (PartitionEntry) -> Unit,
              onFlashPartition: (PartitionEntry) -> Unit,
              onRequestErasePartition: (PartitionEntry) -> Unit
          ) {
              var searchQuery by remember { mutableStateOf("") }

              val availableLuns = remember(state.partitions) {
                  state.partitions.map { it.lun }.distinct().sorted()
              }

              val filtered = remember(state.partitions, state.selectedLunFilter, searchQuery) {
                  state.partitions.filter { part ->
                      val matchesLun = state.selectedLunFilter == -1 || part.lun == state.selectedLunFilter
                      val matchesQuery = searchQuery.isBlank() || part.name.contains(searchQuery, ignoreCase = true)
                      matchesLun && matchesQuery
                  }
              }

              Column(modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text("Search partition (frp, sec_efs, persistent, userdata...)", fontSize = 12.sp) },
                          singleLine = true,
                          modifier = Modifier.weight(1f)
                      )

                      Button(
                          onClick = onReadGpt,
                          enabled = state.firehoseReady && !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black)
                      ) {
                          Text("Read GPT (${state.partitions.size})", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .horizontalScroll(rememberScrollState()),
                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      FilterChip(
                          selected = state.selectedLunFilter == -1,
                          onClick = { onLunFilterSelected(-1) },
                          label = { Text("All (${state.partitions.size})", fontSize = 11.sp) }
                      )
                      availableLuns.forEach { lun ->
                          val count = state.partitions.count { it.lun == lun }
                          FilterChip(
                              selected = state.selectedLunFilter == lun,
                              onClick = { onLunFilterSelected(lun) },
                              label = { Text("LUN $lun ($count)", fontSize = 11.sp) }
                          )
                      }

                      Spacer(modifier = Modifier.width(6.dp))

                      OutlinedButton(
                          onClick = { onSelectAllParts(filtered.map { it.idKey }) },
                          enabled = filtered.isNotEmpty() && !state.isBusy,
                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                          modifier = Modifier.height(30.dp)
                      ) {
                          Text("Select All", fontSize = 11.sp, color = YasCyan)
                      }

                      if (state.selectedPartKeys.isNotEmpty()) {
                          OutlinedButton(
                              onClick = onClearPartSelection,
                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                              modifier = Modifier.height(30.dp)
                          ) {
                              Text("Clear (${state.selectedPartKeys.size})", fontSize = 11.sp, color = Color.LightGray)
                          }

                          Button(
                              onClick = onRequestBatchErase,
                              enabled = !state.isBusy,
                              colors = ButtonDefaults.buttonColors(containerColor = YasRed),
                              contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp),
                              modifier = Modifier.height(30.dp)
                          ) {
                              Text("Erase Selected (${state.selectedPartKeys.size})", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  if (filtered.isEmpty()) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(YasCardBg, RoundedCornerShape(8.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = if (state.partitions.isEmpty())
                                  "No GPT partitions loaded yet.\nConnect device and tap 'Read Full GPT' or run the X216B Wipe & Write button."
                              else
                                  "No partitions match your search filter.",
                              color = Color.Gray,
                              fontSize = 12.sp
                          )
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          verticalArrangement = Arrangement.spacedBy(4.dp)
                      ) {
                          items(filtered, key = { it.idKey }) { part ->
                              val isChecked = part.idKey in state.selectedPartKeys
                              Surface(
                                  color = if (isChecked) Color(0xFF1B2E46) else YasCardBg,
                                  shape = RoundedCornerShape(6.dp),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { onTogglePartSelection(part.idKey) }
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(horizontal = 6.dp, vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Checkbox(
                                              checked = isChecked,
                                              onCheckedChange = { onTogglePartSelection(part.idKey) },
                                              modifier = Modifier.size(32.dp)
                                          )
                                          Column(modifier = Modifier.padding(start = 4.dp)) {
                                              Row(
                                                  verticalAlignment = Alignment.CenterVertically,
                                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                                              ) {
                                                  Text(text = part.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                                  Text(text = "LUN ${part.lun}", color = YasCyan, fontSize = 10.sp, fontWeight = FontWeight.SemiBold)
                                                  Text(text = formatSize(part.sizeInBytes), color = YasOrange, fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                                              }
                                              Text(
                                                  text = "LBA: ${part.firstLba} .. ${part.lastLba} (${part.numSectors} sec)",
                                                  color = Color.Gray,
                                                  fontSize = 10.sp,
                                                  fontFamily = FontFamily.Monospace
                                              )
                                          }
                                      }

                                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                          Button(
                                              onClick = { onBackupPartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1F4068)),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Read", fontSize = 11.sp, color = YasCyan)
                                          }

                                          Button(
                                              onClick = { onFlashPartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Write", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                          }

                                          Button(
                                              onClick = { onRequestErasePartition(part) },
                                              enabled = !state.isBusy,
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF4A1C1C)),
                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                              modifier = Modifier.height(30.dp)
                                          ) {
                                              Text("Erase", fontSize = 11.sp, color = YasRed, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

