name: Build YAS SOFTWARE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check source layout (no files are deleted or moved)
        run: |
          # Read-only check. Nothing is deleted, moved or edited here.
          # These three files belong ONLY in .../flasher/ui/. A copy in .../flasher/protocol/
          # causes "Redeclaration" / "Conflicting overloads" compile errors.
          B=app/src/main/java/com/edl/flasher
          FAIL=0
          for f in EdlMainScreen.kt EdlViewModel.kt LogSanitizer.kt; do
            if [ -f "$B/protocol/$f" ]; then
              echo "::error::Stray $B/protocol/$f - delete it from the repository (it belongs in ui/)."
              FAIL=1
            fi
            if [ ! -f "$B/ui/$f" ]; then
              echo "::error::Missing $B/ui/$f - upload it into the ui folder."
              FAIL=1
            fi
          done
          if ! grep -q "PackageEntry" "$B/protocol/OdinTarFlasher.kt"; then
            echo "::warning::protocol/OdinTarFlasher.kt looks like the OLD version (no PackageEntry). Build continues; if it fails, upload the new file to $B/protocol/"
            echo "OdinTarFlasher.kt copies found in the repo:"
            find . -name "OdinTarFlasher.kt" -not -path "./.git/*"
          fi
          [ "$FAIL" -eq 0 ] || exit 1


      - name: Copy Embedded X216B Firmware Assets From Repository
        run: |
          set -e
          mkdir -p app/src/main/assets/x216b
          SRC_DIR="firmware/x216b"
          REQUIRED_FILES=("X216B.elf" "frp.bin" "sec_efs.bin" "persistent.bin" "misc.bin")

          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::Missing '$SRC_DIR/' in the repository. Commit X216B.elf, frp.bin, sec_efs.bin, persistent.bin and misc.bin there (git add, or GitHub web 'Upload files' — each file is under the 25MB web-upload limit)."
            exit 1
          fi

          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$SRC_DIR/$f" ]; then
              echo "::error::Missing required firmware file: $SRC_DIR/$f"
              MISSING=1
            else
              cp "$SRC_DIR/$f" "app/src/main/assets/x216b/$f"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::One or more required X216B firmware files are missing from $SRC_DIR/. The APK will still build, but the embedded one-tap Wipe & Write flow will be disabled until these are committed."
          fi

          echo "Embedded firmware assets staged:"
          ls -la app/src/main/assets/x216b/ || true

      - name: Copy Embedded T509 / T509N Firmware Assets From Repository
        run: |
          set -e
          REQUIRED_FILES=("fdl1-sign.bin" "fdl2-sign.bin")
          for VARIANT in t509 t509n; do
            mkdir -p "app/src/main/assets/$VARIANT"
            SRC_DIR="firmware/$VARIANT"
            if [ ! -d "$SRC_DIR" ]; then
              echo "::warning::Missing '$SRC_DIR/' in the repository. Commit fdl1-sign.bin and fdl2-sign.bin there (git add, or GitHub web 'Upload files') for the $VARIANT tab to work."
              continue
            fi
            for f in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$SRC_DIR/$f" ]; then
                echo "::warning::Missing firmware file: $SRC_DIR/$f -- the $VARIANT tab will report firmware as not ready until it is committed."
              else
                cp "$SRC_DIR/$f" "app/src/main/assets/$VARIANT/$f"
              fi
            done
          done
          echo "Embedded T509/T509N firmware assets staged:"
          ls -la app/src/main/assets/t509/ app/src/main/assets/t509n/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK Clean
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --no-build-cache --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          python3 - << 'PYEOF'
          import os, re
          log = open("build.log", encoding="utf-8", errors="replace").read()
          root = os.getcwd() + "/"
          rows = []
          for m in re.finditer(r"^e: (?:file://)?(\S+?):(\d+):(\d+)\s+(.*)$", log, re.M):
              path, line, col, msg = m.groups()
              path = path.replace(root, "")
              rows.append((path, line, col, msg))
              if len(rows) <= 10:
                  print("::error file=%s,line=%s,col=%s::%s" % (path, line, col, msg.replace("%", "%25")))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              if rows:
                  s.write("## Kotlin compile errors (%d)\n\n" % len(rows))
                  for path, line, col, msg in rows:
                      s.write("- `%s` line %s: %s\n" % (path, line, msg))
              else:
                  m = re.search(r"\* What went wrong:\n(.*?)\n\n", log, re.S)
                  s.write("## Build failed\n\n```\n%s\n```\n" % (m.group(1) if m else log[-1500:]))
          PYEOF

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: YAS-SOFTWARE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
