name: Build YAS SOFTWARE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets/x216b
          mkdir -p app/src/main/java/com/edl/flasher/usb
          mkdir -p app/src/main/java/com/edl/flasher/protocol
          mkdir -p app/src/main/java/com/edl/flasher/ui

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "YasSoftware"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.edl.flasher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.yas.flashedl"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 11
                  versionName = "4.0-YAS-X216B-Odin"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              // Keep firmware assets uncompressed in the APK: this lets AssetFileDescriptor
              // report an exact length (needed by EmbeddedFirmware.sizeOf) and lets large
              // files such as sec_efs.bin be streamed directly without loading them fully
              // into memory first.
              androidResources {
                  noCompress += listOf("elf", "bin")
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.documentfile:documentfile:1.0.1")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device vendor-id="1478" product-id="36872" />
              <usb-device vendor-id="1256" product-id="26717" />
              <usb-device vendor-id="1256" product-id="26113" />
              <usb-device vendor-id="1256" product-id="26819" />
          </resources>
          EOF

          # --- YAS SOFTWARE logo as an adaptive launcher icon ---
          # Solid background layer matching the app's dark theme color.
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B1530" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # Foreground layer: the same logo, inset so no launcher mask clips it.
          # (Pure XML on purpose: a second embedded PNG pushed this file past GitHub's 500 KB limit.)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/yas_logo"
              android:inset="20%" />
          EOF

          # In-app header logo (same artwork, rounded tile with transparent corners)
          cat << 'ICONEOF' | sed 's/^ \{10\}//' | base64 -d > app/src/main/res/drawable-nodpi/yas_logo.png
