          cat << 'EOF' > app/src/main/java/com/edl/flasher/protocol/AdbCrypto.kt
          package com.edl.flasher.protocol

          import android.content.Context
          import android.util.Base64
          import java.io.File
          import java.math.BigInteger
          import java.security.KeyFactory
          import java.security.KeyPair
          import java.security.KeyPairGenerator
          import java.security.spec.PKCS8EncodedKeySpec
          import java.security.spec.X509EncodedKeySpec
          import java.security.interfaces.RSAPrivateCrtKey
          import java.security.interfaces.RSAPublicKey
          import javax.crypto.Cipher

          /**
           * RSA key-pair generation/storage and the ADB AUTH signing scheme used by the
           * real `adb` host tool. This re-implements the public, documented wire format
           * only -- it does not and cannot skip the on-device "Allow USB debugging?"
           * authorization prompt the first time a given key talks to a given phone.
           */
          object AdbCrypto {

              private const val KEY_LEN_BITS = 2048
              private const val KEY_LEN_BYTES = KEY_LEN_BITS / 8
              private const val KEY_LEN_WORDS = KEY_LEN_BYTES / 4

              fun loadOrGenerateKeyPair(context: Context): KeyPair {
                  val dir = File(context.filesDir, "adbkey")
                  val privFile = File(dir, "adbkey.priv")
                  val pubFile = File(dir, "adbkey.pub")
                  if (privFile.exists() && pubFile.exists()) {
                      runCatching {
                          val kf = KeyFactory.getInstance("RSA")
                          val priv = kf.generatePrivate(PKCS8EncodedKeySpec(Base64.decode(privFile.readText(), Base64.DEFAULT)))
                          val pub = kf.generatePublic(X509EncodedKeySpec(Base64.decode(pubFile.readText(), Base64.DEFAULT)))
                          return KeyPair(pub, priv)
                      }
                  }
                  val kpg = KeyPairGenerator.getInstance("RSA")
                  kpg.initialize(KEY_LEN_BITS)
                  val pair = kpg.generateKeyPair()
                  dir.mkdirs()
                  runCatching {
                      privFile.writeText(Base64.encodeToString(pair.private.encoded, Base64.DEFAULT))
                      pubFile.writeText(Base64.encodeToString(pair.public.encoded, Base64.DEFAULT))
                  }
                  return pair
              }

              /** Signs a 20-byte ADB auth token using the ADB-specific PKCS#1 v1.5 padding
               *  (0x00 0x01 0xFF...0xFF 0x00 + SHA-1 DigestInfo prefix + 20-byte token). */
              fun sign(keyPair: KeyPair, token: ByteArray): ByteArray {
                  val padded = ByteArray(KEY_LEN_BYTES)
                  padded[0] = 0x00
                  padded[1] = 0x01
                  // ADB signs the token as a pre-hashed SHA-1 digest: PKCS#1 v1.5 padding WITH the SHA-1 DigestInfo prefix.
                  val digestInfoPrefix = byteArrayOf(
                      0x30, 0x21, 0x30, 0x09, 0x06, 0x05, 0x2b, 0x0e,
                      0x03, 0x02, 0x1a, 0x05, 0x00, 0x04, 0x14
                  )
                  val padLen = KEY_LEN_BYTES - 3 - digestInfoPrefix.size - token.size
                  for (i in 0 until padLen) padded[2 + i] = 0xFF.toByte()
                  padded[2 + padLen] = 0x00
                  System.arraycopy(digestInfoPrefix, 0, padded, 3 + padLen, digestInfoPrefix.size)
                  System.arraycopy(token, 0, padded, 3 + padLen + digestInfoPrefix.size, token.size)

                  val cipher = Cipher.getInstance("RSA/ECB/NoPadding")
                  cipher.init(Cipher.ENCRYPT_MODE, keyPair.private)
                  return cipher.doFinal(padded)
              }

              /** Encodes the public key in ADB's own binary RSAPublicKey struct format,
               *  base64s it and appends a " comment" field, matching what a real adb
               *  client sends for AUTH_RSAPUBLICKEY. */
              fun publicKeyToAdbFormat(keyPair: KeyPair): String {
                  val priv = keyPair.private as RSAPrivateCrtKey
                  val n = priv.modulus
                  val e = priv.publicExponent

                  val r32 = BigInteger.ONE.shiftLeft(32)
                  val r = BigInteger.ONE.shiftLeft(32 * KEY_LEN_WORDS)
                  val rr = r.multiply(r).mod(n)
                  val n0 = n.mod(r32)
                  val n0invRaw = n0.modInverse(r32)
                  val n0inv = r32.subtract(n0invRaw).mod(r32)

                  val buf = java.io.ByteArrayOutputStream()
                  buf.write(leWord(KEY_LEN_WORDS))
                  buf.write(leWord(n0inv.toInt()))
                  buf.write(bigIntToLeWords(n, KEY_LEN_WORDS))
                  buf.write(bigIntToLeWords(rr, KEY_LEN_WORDS))
                  buf.write(leWord(e.toInt()))

                  val encoded = Base64.encodeToString(buf.toByteArray(), Base64.NO_WRAP)
                  return "$encoded yas-flash-edl@mtp-adb"
              }

              private fun leWord(value: Int): ByteArray {
                  return byteArrayOf(
                      (value and 0xFF).toByte(),
                      ((value shr 8) and 0xFF).toByte(),
                      ((value shr 16) and 0xFF).toByte(),
                      ((value shr 24) and 0xFF).toByte()
                  )
              }

              private fun bigIntToLeWords(value: BigInteger, words: Int): ByteArray {
                  var v = value
                  val out = ByteArray(words * 4)
                  val mask = BigInteger.valueOf(0xFFFFFFFFL)
                  for (i in 0 until words) {
                      val word = v.and(mask).toInt()
                      val wordBytes = leWord(word)
                      System.arraycopy(wordBytes, 0, out, i * 4, 4)
                      v = v.shiftRight(32)
                  }
                  return out
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/edl/flasher/protocol/AdbClient.kt
          package com.edl.flasher.protocol

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbManager
          import android.os.Build
          import com.edl.flasher.usb.AdbUsbTransport
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlin.coroutines.resume

          /**
           * Thin client over the standard ADB protocol: CONNECT/AUTH handshake, opening
           * a "shell:<cmd>" stream and reading its output, and sending "reboot:<target>".
           * Authorization is exactly what a PC's adb would require -- the very first
           * connection from this app's key still needs the user to tap "Allow" on the
           * target device's own USB-debugging prompt.
           */
          class AdbClient(private val context: Context, private val log: (String) -> Unit) {

              companion object {
                  private const val ACTION_ADB_USB_PERMISSION = "com.yas.flashedl.ADB_USB_PERMISSION"
              }

              private val transport = AdbUsbTransport(context)
              private var localIdCounter = 1

              var banner: String = ""
                  private set

              suspend fun connect(): Boolean {
                  val dev = transport.findAdbCapableDevices().firstOrNull()
                  if (dev == null) {
                      log("No USB-debugging capable device found. Enable Developer Options -> USB debugging on the target and keep it plugged in.")
                      return false
                  }
                  if (!transport.hasPermission(dev) && !requestPermission(dev)) {
                      log("USB permission denied for the ADB-capable device.")
                      return false
                  }
                  if (!transport.open(dev)) {
                      log("Failed to open the ADB USB interface.")
                      return false
                  }

                  val keyPair = AdbCrypto.loadOrGenerateKeyPair(context)
                  sendMessage(
                      AdbMessage(
                          AdbProtocolConst.A_CNXN,
                          AdbProtocolConst.A_VERSION,
                          AdbProtocolConst.MAX_PAYLOAD,
                          "host::yas-flash-edl\u0000".toByteArray()
                      )
                  )

                  var authAttempts = 0
                  while (authAttempts < 4) {
                      val msg = readMessage() ?: return false
                      when (msg.command) {
                          AdbProtocolConst.A_CNXN -> {
                              banner = String(msg.payload).trimEnd('\u0000')
                              log("ADB connected: $banner")
                              return true
                          }
                          AdbProtocolConst.A_AUTH -> {
                              if (msg.arg0 != AdbProtocolConst.AUTH_TOKEN) continue
                              authAttempts++
                              if (authAttempts == 1) {
                                  val signature = AdbCrypto.sign(keyPair, msg.payload)
                                  sendMessage(AdbMessage(AdbProtocolConst.A_AUTH, AdbProtocolConst.AUTH_SIGNATURE, 0, signature))
                              } else {
                                  log("Check the target device's screen and tap 'Allow' for USB debugging.")
                                  val pubKey = (AdbCrypto.publicKeyToAdbFormat(keyPair) + "\u0000").toByteArray()
                                  sendMessage(AdbMessage(AdbProtocolConst.A_AUTH, AdbProtocolConst.AUTH_RSAPUBLICKEY, 0, pubKey))
                              }
                          }
                          else -> { /* ignore stray packets before the handshake completes */ }
                      }
                  }
                  log("ADB handshake timed out waiting for device authorization.")
                  return false
              }

              suspend fun shell(command: String, timeoutMs: Long = 15000): String {
                  val localId = localIdCounter++
                  sendMessage(AdbMessage(AdbProtocolConst.A_OPEN, localId, 0, "shell:$command\u0000".toByteArray()))

                  val output = StringBuilder()
                  val deadline = System.currentTimeMillis() + timeoutMs
                  while (System.currentTimeMillis() < deadline) {
                      val msg = readMessage() ?: break
                      when (msg.command) {
                          AdbProtocolConst.A_WRTE -> {
                              if (msg.arg1 == localId) {
                                  output.append(String(msg.payload))
                                  sendMessage(AdbMessage(AdbProtocolConst.A_OKAY, localId, msg.arg0))
                              }
                          }
                          AdbProtocolConst.A_CLSE -> {
                              if (msg.arg1 == localId) {
                                  sendMessage(AdbMessage(AdbProtocolConst.A_CLSE, localId, msg.arg0))
                                  return output.toString()
                              }
                          }
                          else -> { /* OKAY for the OPEN itself, etc. -- nothing to do */ }
                      }
                  }
                  return output.toString()
              }

              /** target: "" (normal), "recovery", "download" (Samsung Odin/Download mode),
               *  "edl" (Qualcomm chips that expose it), "bootloader". */
              suspend fun reboot(target: String) {
                  val localId = localIdCounter++
                  sendMessage(AdbMessage(AdbProtocolConst.A_OPEN, localId, 0, "reboot:$target\u0000".toByteArray()))
                  runCatching {
                      val deadline = System.currentTimeMillis() + 3000
                      while (System.currentTimeMillis() < deadline) {
                          val msg = readMessage() ?: break
                          if (msg.command == AdbProtocolConst.A_CLSE) break
                      }
                  }
              }

              fun close() {
                  transport.close()
              }

              private suspend fun requestPermission(dev: UsbDevice): Boolean = suspendCancellableCoroutine { cont ->
                  val usbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
                  val receiver = object : BroadcastReceiver() {
                      override fun onReceive(ctx: Context, intent: Intent) {
                          if (intent.action == ACTION_ADB_USB_PERMISSION) {
                              context.unregisterReceiver(this)
                              if (cont.isActive) {
                                  cont.resume(intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false))
                              }
                          }
                      }
                  }
                  val filter = IntentFilter(ACTION_ADB_USB_PERMISSION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      context.registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      context.registerReceiver(receiver, filter)
                  }
                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      PendingIntent.FLAG_MUTABLE or PendingIntent.FLAG_ALLOW_UNSAFE_IMPLICIT_INTENT
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      PendingIntent.FLAG_MUTABLE
                  } else {
                      0
                  }
                  val pendingIntent = PendingIntent.getBroadcast(context, 0, Intent(ACTION_ADB_USB_PERMISSION), flags)
                  usbManager.requestPermission(dev, pendingIntent)
                  cont.invokeOnCancellation { runCatching { context.unregisterReceiver(receiver) } }
              }

              private fun sendMessage(msg: AdbMessage) {
                  transport.write(msg.encodeHeader())
                  if (msg.payload.isNotEmpty()) transport.write(msg.payload)
              }

              private fun readMessage(): AdbMessage? {
                  return try {
                      val header = transport.readExact(24)
                      val fields = AdbMessage.decodeHeader(header)
                      val dataLen = fields[3]
                      val payload = if (dataLen > 0) transport.readExact(dataLen) else ByteArray(0)
                      AdbMessage(fields[0], fields[1], fields[2], payload)
                  } catch (e: Exception) {
                      log("ADB read error: ${e.message}")
                      null
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/edl/flasher/protocol/MtpInfoReader.kt
          package com.edl.flasher.protocol

          import android.content.Context
          import android.hardware.usb.UsbConstants
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbManager

          /** Reads USB-descriptor-level info from a device connected in MTP / File
           *  Transfer mode. No ADB and no extra permissions beyond normal USB host
           *  access are required for the VID/PID/interface info; manufacturer, product
           *  and serial strings need the standard USB permission grant. */
          object MtpInfoReader {

              private const val USB_CLASS_STILL_IMAGE = 6 // PTP/MTP devices commonly expose this class

              fun findMtpDevices(context: Context): List<UsbDevice> {
                  val usbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
                  return usbManager.deviceList.values.filter { dev ->
                      (0 until dev.interfaceCount).any { i ->
                          val intf = dev.getInterface(i)
                          intf.interfaceClass == USB_CLASS_STILL_IMAGE ||
                              (intf.interfaceClass == UsbConstants.USB_CLASS_VENDOR_SPEC && intf.interfaceSubclass == 0xFF)
                      }
                  }
              }

              fun describe(context: Context, dev: UsbDevice): String {
                  val usbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
                  val hasPermission = usbManager.hasPermission(dev)
                  val sb = StringBuilder()
                  sb.appendLine("Vendor ID: 0x${dev.vendorId.toString(16).uppercase()}")
                  sb.appendLine("Product ID: 0x${dev.productId.toString(16).uppercase()}")
                  sb.appendLine("Device Name: ${dev.deviceName}")
                  if (hasPermission) {
                      sb.appendLine("Manufacturer: ${runCatching { dev.manufacturerName }.getOrNull() ?: "Unknown"}")
                      sb.appendLine("Product: ${runCatching { dev.productName }.getOrNull() ?: "Unknown"}")
                      sb.appendLine("Serial: ${runCatching { dev.serialNumber }.getOrNull() ?: "Unavailable"}")
                  } else {
                      sb.appendLine("Grant USB permission to read Manufacturer/Product/Serial.")
                  }
                  sb.appendLine("Interfaces: ${dev.interfaceCount}")
                  return sb.toString()
              }
          }
          EOF

      - name: Copy Embedded X216B Firmware Assets From Repository
        run: |
          set -e
          mkdir -p app/src/main/assets/x216b
          SRC_DIR="firmware/x216b"
          REQUIRED_FILES=("X216B.elf" "frp.bin" "sec_efs.bin" "persistent.bin")

          if [ ! -d "$SRC_DIR" ]; then
            echo "::error::Missing '$SRC_DIR/' in the repository. Commit X216B.elf, frp.bin, sec_efs.bin and persistent.bin there (git add, or GitHub web 'Upload files' — all 4 files are under the 25MB web-upload limit)."
            exit 1
          fi

          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$SRC_DIR/$f" ]; then
              echo "::error::Missing required firmware file: $SRC_DIR/$f"
              MISSING=1
            else
              cp "$SRC_DIR/$f" "app/src/main/assets/x216b/$f"
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::One or more required X216B firmware files are missing from $SRC_DIR/. The APK will still build, but the embedded one-tap Wipe & Write flow will be disabled until these are committed."
          fi

          echo "Embedded firmware assets staged:"
          ls -la app/src/main/assets/x216b/ || true

      - name: Copy Embedded T509 / T509N Firmware Assets From Repository
        run: |
          set -e
          REQUIRED_FILES=("fdl1-sign.bin" "fdl2-sign.bin")
          for VARIANT in t509 t509n; do
            mkdir -p "app/src/main/assets/$VARIANT"
            SRC_DIR="firmware/$VARIANT"
            if [ ! -d "$SRC_DIR" ]; then
              echo "::warning::Missing '$SRC_DIR/' in the repository. Commit fdl1-sign.bin and fdl2-sign.bin there (git add, or GitHub web 'Upload files') for the $VARIANT tab to work."
              continue
            fi
            for f in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$SRC_DIR/$f" ]; then
                echo "::warning::Missing firmware file: $SRC_DIR/$f -- the $VARIANT tab will report firmware as not ready until it is committed."
              else
                cp "$SRC_DIR/$f" "app/src/main/assets/$VARIANT/$f"
              fi
            done
          done
          echo "Embedded T509/T509N firmware assets staged:"
          ls -la app/src/main/assets/t509/ app/src/main/assets/t509n/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK Clean
        run: gradle assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: YAS-SOFTWARE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
