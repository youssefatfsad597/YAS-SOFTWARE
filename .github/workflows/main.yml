          private fun copyToClipboard(context: Context, label: String, text: String) {
              if (text.isBlank()) return
              val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText(label, text))
              Toast.makeText(context, "Copied: $label", Toast.LENGTH_SHORT).show()
          }

          @Composable
          private fun InfoCopyRow(label: String, value: String, context: Context) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Column(modifier = Modifier.weight(1f)) {
                      Text(label, fontSize = 10.sp, color = YasMuted)
                      SelectionContainer {
                          Text(
                              value.ifBlank { "Not available" },
                              fontSize = 15.sp,
                              color = Color.White,
                              fontFamily = FontFamily.Monospace,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
                  OutlinedButton(
                      onClick = { copyToClipboard(context, label, value) },
                      enabled = value.isNotBlank(),
                      contentPadding = PaddingValues(horizontal = 14.dp, vertical = 4.dp),
                      modifier = Modifier.height(34.dp)
                  ) {
                      Text("Copy", fontSize = 12.sp, color = YasCyan)
                  }
              }
          }

          private fun formatSize(bytes: Long): String {
              val kb = bytes / 1024.0
              val mb = kb / 1024.0
              val gb = mb / 1024.0
              return when {
                  gb >= 1.0 -> String.format("%.2f GB", gb)
                  mb >= 1.0 -> String.format("%.2f MB", mb)
                  else -> String.format("%.0f KB", kb)
              }
          }
