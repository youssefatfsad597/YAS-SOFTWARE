          @Composable
          private fun SamsungOdinTab(
              state: EdlUiState,
              onConnectOdinDevice: () -> Unit,
              onPickBlTar: () -> Unit,
              onPickApTar: () -> Unit,
              onPickCpTar: () -> Unit,
              onPickCscTar: () -> Unit,
              onPickUserdataTar: () -> Unit,
              onRunOdinFlash: () -> Unit,
              onFlashUserdataOnly: () -> Unit,
              onToggleOdinAutoReboot: (Boolean) -> Unit,
              onExitDownloadMode: () -> Unit,
              onMtpDownloadAt: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, if (state.odinConnected) YasGreen else YasRed, RoundedCornerShape(8.dp))
                  ) {
                      Column(modifier = Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column {
                                  Text("Samsung Download Mode (Odin protocol)", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                  Text(
                                      state.odinDeviceDescription,
                                      fontSize = 11.sp,
                                      color = if (state.odinConnected) YasGreen else YasRed
                                  )
                              }
                              Button(
                                  onClick = onConnectOdinDevice,
                                  enabled = !state.isBusy,
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (state.odinConnected) Color(0xFF1E3A5F) else YasCyan,
                                      contentColor = if (state.odinConnected) Color.White else Color.Black
                                  ),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 6.dp)
                              ) {
                                  Text(if (state.odinConnected) "Connected" else "Connect to Download Mode", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }

                                  Button(
                                      onClick = onMtpDownloadAt,
                                      enabled = !state.isBusy && !state.odinConnected,
                                      colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color.Black),
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(40.dp)
                                  ) {
                                      Text("MTP -> Download Mode", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(
                                      checked = state.odinAutoReboot,
                                      onCheckedChange = onToggleOdinAutoReboot,
                                      enabled = !state.isBusy
                                  )
                                  Text("Auto-reboot after the operation", color = Color.LightGray, fontSize = 12.sp)
                              }
                              OutlinedButton(
                                  onClick = onExitDownloadMode,
                                  enabled = !state.isBusy,
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp)
                              ) {
                                  Text("Exit Download Mode", fontSize = 11.sp, color = YasOrange, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }

                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .border(1.dp, YasGreen, RoundedCornerShape(8.dp))
                  ) {
                      Column(modifier = Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Text("Fast: flash userdata.tar only", color = YasGreen, fontWeight = FontWeight.ExtraBold, fontSize = 13.sp)

                          OutlinedButton(
                              onClick = onPickUserdataTar,
                              enabled = !state.isBusy,
                              modifier = Modifier.fillMaxWidth(),
                              contentPadding = PaddingValues(8.dp)
                          ) {
                              Text(state.userdataTarName, fontSize = 11.sp, color = YasCyan, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }

                          Button(
                              onClick = onFlashUserdataOnly,
                              enabled = !state.isBusy && state.userdataTarUri != null,
                              colors = ButtonDefaults.buttonColors(containerColor = YasGreen, contentColor = Color.Black),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(42.dp)
                          ) {
                              Text("⚡ Flash userdata (img / tar)", fontWeight = FontWeight.ExtraBold, fontSize = 13.sp)
                          }
                      }
                  }

                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          Text("Flash Full Package (BL / AP / CP / CSC / USERDATA)", color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                          Text(
                              "Pick any set below; the selected packages are flashed in order BL -> AP -> CP -> CSC -> USERDATA, exactly as the official Odin software does.",
                              fontSize = 10.sp,
                              color = Color.LightGray
                          )

                          OutlinedButton(onClick = onPickBlTar, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth(), contentPadding = PaddingValues(8.dp)) {
                              Text(state.blTarName, fontSize = 11.sp, color = YasCyan, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          OutlinedButton(onClick = onPickApTar, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth(), contentPadding = PaddingValues(8.dp)) {
                              Text(state.apTarName, fontSize = 11.sp, color = YasOrange, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          OutlinedButton(onClick = onPickCpTar, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth(), contentPadding = PaddingValues(8.dp)) {
                              Text(state.cpTarName, fontSize = 11.sp, color = YasGreen, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          OutlinedButton(onClick = onPickCscTar, enabled = !state.isBusy, modifier = Modifier.fillMaxWidth(), contentPadding = PaddingValues(8.dp)) {
                              Text(state.cscTarName, fontSize = 11.sp, color = Color.LightGray, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }

                          Button(
                              onClick = onRunOdinFlash,
                              enabled = !state.isBusy && (
                                  state.blTarUri != null || state.apTarUri != null ||
                                  state.cpTarUri != null || state.cscTarUri != null ||
                                  state.userdataTarUri != null
                              ),
                              colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color.Black),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(44.dp)
                          ) {
                              Text("Start Odin Flash (Selected Packages)", fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  Surface(
                      color = YasCardBg,
                      shape = RoundedCornerShape(8.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.padding(10.dp)) {
                          Text(
                              "Note: the device itself validates every image (signature, partition size, lock/MDM state). " +
                                  "Any rejection from the device is shown as-is in the console below -- nothing here tries to bypass that.",
                              fontSize = 10.sp,
                              color = Color.Gray
                          )
                      }
                  }
              }
          }

          @Composable
          private fun AdbMtpTab(
              state: EdlUiState,
              onReadMtpInfo: () -> Unit,
              onMtpRebootAt: () -> Unit,
              onMtpDownloadAt: () -> Unit,
              onReadAdbInfo: () -> Unit,
              onAdbReboot: (String, String) -> Unit,
              onAdbShell: (String) -> Unit
              ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState()),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  // ---- 1) Read info ----
                  Text("READ INFO", fontSize = 10.sp, color = YasMuted, fontWeight = FontWeight.Bold)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      Button(
                          onClick = onReadMtpInfo,
                          enabled = !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("Read Info (MTP)", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                      Button(
                          onClick = onReadAdbInfo,
                          enabled = !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasGreen, contentColor = Color.Black),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("Read Info (ADB)", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  // ---- 2) MTP actions (no USB debugging needed) ----
                  Text("MTP  -  no USB debugging needed", fontSize = 10.sp, color = YasMuted, fontWeight = FontWeight.Bold)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      Button(
                          onClick = onMtpDownloadAt,
                          enabled = !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color.Black),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("MTP -> Download", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                      OutlinedButton(
                          onClick = onMtpRebootAt,
                          enabled = !state.isBusy,
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("MTP -> Reboot", fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  }

                  // ---- 3) ADB actions (USB debugging must be on) ----
                  Text("ADB  -  USB debugging must be on", fontSize = 10.sp, color = YasMuted, fontWeight = FontWeight.Bold)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      Button(
                          onClick = { onAdbReboot("download", "Download Mode") },
                          enabled = !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasOrange, contentColor = Color.Black),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("ADB -> Download", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                      Button(
                          onClick = { onAdbReboot("recovery", "Recovery") },
                          enabled = !state.isBusy,
                          colors = ButtonDefaults.buttonColors(containerColor = YasCyan, contentColor = Color.Black),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("ADB -> Recovery", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                      }
                      OutlinedButton(
                          onClick = { onAdbReboot("", "Normal Reboot") },
                          enabled = !state.isBusy,
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(horizontal = 4.dp, vertical = 10.dp)
                      ) {
                          Text("ADB -> Reboot", fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  }
                  val infoContext = LocalContext.current
                  if (state.infoImei.isNotBlank() || state.infoSerial.isNotBlank()) {
                      Surface(
                          color = YasCardBg,
                          shape = RoundedCornerShape(8.dp),
                          modifier = Modifier
                              .fillMaxWidth()
                              .border(1.dp, YasGreen, RoundedCornerShape(8.dp))
                      ) {
                          Column(modifier = Modifier.padding(10.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              InfoCopyRow("IMEI", state.infoImei, infoContext)
                              InfoCopyRow("Serial (SN)", state.infoSerial, infoContext)
                          }
                      }
                  }

                  var shellCmd by remember { mutableStateOf("") }
                  Row(
