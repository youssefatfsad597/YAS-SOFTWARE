name: Generate Release Keystore (run ONCE)

# Run this manually from the Actions tab (phone browser works fine).
# It creates a brand-new signing keystore on GitHub's runner, prints the
# SHA-256 fingerprint you need for RELEASE_CERT_SHA256, and uploads the
# keystore file so you can download and keep it somewhere safe.
#
# Run this exactly once. After you've downloaded the keystore and saved
# the fingerprint, go to this workflow's run page and delete the run
# (Actions tab -> this run -> "..." -> Delete workflow run) so the
# keystore file is not left sitting in your Actions history.

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Password for the keystore (remember this - you'll need it for every release build)"
        required: true
      key_password:
        description: "Password for the key itself (can be the same as above)"
        required: true
      key_alias:
        description: "Alias name for the key"
        required: true
        default: "yas_key"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore yas-release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=YAS SOFTWARE, OU=YAS, O=YAS, L=, S=, C="

      - name: Print SHA-256 fingerprint (copy this into gradle.properties)
        run: |
          echo "## Your RELEASE_CERT_SHA256 value" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          FULL=$(keytool -list -v -keystore yas-release.keystore -alias "${{ inputs.key_alias }}" -storepass "${{ inputs.store_password }}")
          echo "$FULL" | grep "SHA256:"
          HASH=$(echo "$FULL" | grep "SHA256:" | head -n1 | sed 's/.*SHA256: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_CERT_SHA256=$HASH" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Also base64 of the keystore, for the KEYSTORE_BASE64 secret (release.yml workflow):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          base64 -w0 yas-release.keystore >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore (download this and keep it somewhere private)
        uses: actions/upload-artifact@v4
        with:
          name: yas-release-keystore-KEEP-PRIVATE
          path: yas-release.keystore
          retention-days: 1
